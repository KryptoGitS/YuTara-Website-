<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YuTara | Log In</title>
  <link rel="icon" type="image/png" href="assets/yutara-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=23" />
</head>
<body class="login-page-body">

  <!-- Full-Screen Two-Column Login Stage Over Uploaded Green & Gold Landscape Frame -->
  <main class="login-stage">
    <div class="login-grid">

      <!-- LEFT COLUMN: Branding & Visual Trust Indicators -->
      <section class="login-brand-col anim-fade-up" data-anim="ytFadeInUp" aria-label="YuTara Introduction">
        <img src="assets/yutara-logo.png" alt="YuTara" class="login-brand-logo" />

        <div>
          <span class="login-trust-badge">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <polyline points="9 12 11 14 15 10"></polyline>
            </svg>
            Start Local. Build Trust.
          </span>
        </div>

        <h1 class="login-headline">
          Yuta ba?<br />
          <span class="login-headline-accent">YuTara.</span>
        </h1>

        <p class="login-lead">
          Verified land and trusted connections, starting in Panabo City.
        </p>

        <div class="login-indicators">
          <div class="login-indicator-pill">
            <span class="login-indicator-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <polyline points="9 12 11 14 15 10"></polyline>
              </svg>
            </span>
            <span>Trusted Listings</span>
          </div>

          <div class="login-indicator-pill">
            <span class="login-indicator-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <polyline points="16 11 18 13 22 9"></polyline>
              </svg>
            </span>
            <span>Verified Sellers</span>
          </div>

          <div class="login-indicator-pill">
            <span class="login-indicator-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </span>
            <span>Panabo City</span>
          </div>
        </div>
      </section>

      <!-- RIGHT COLUMN: Premium White Login Card -->
      <section class="login-card anim-fade-up" data-anim="ytFadeInUp" aria-label="Account Sign In">
        <div class="login-card-top">
          <img src="assets/yutara-logo.png" alt="YuTara" class="login-card-logo" />
          <a href="index.html" class="login-back-link">&larr; Back to Home</a>
        </div>

        <h2 class="login-card-title">Log In</h2>
        <p class="login-card-subtitle">Sign in to your account to continue.</p>

        <div id="login-status" class="alert hidden" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-email">Email</label>
            <div class="login-input-wrap">
              <span class="login-input-icon" aria-hidden="true">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
              </span>
              <input
                type="email"
                id="login-email"
                class="login-input"
                placeholder="Enter your email address."
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="login-input-wrap">
              <span class="login-input-icon" aria-hidden="true">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input
                type="password"
                id="login-password"
                class="login-input login-input-pw"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="login-pw-toggle"
                data-toggle-password="login-password"
                aria-label="Show password"
              >Show</button>
            </div>
          </div>

          <div class="login-options-row">
            <label class="login-remember-label">
              <input type="checkbox" id="login-remember" />
              <span>Remember me</span>
            </label>
          </div>

          <!-- Hidden role fallback for custom emails -->
          <input type="hidden" id="login-role" value="User" />

          <button type="submit" class="login-submit-btn">
            <span>Log In</span>
            <span aria-hidden="true">&rarr;</span>
          </button>
        </form>

        <!-- Registration Link -->
        <div class="login-register-box">
          <p class="text-no-margin">
            Don't have an account?
            <a href="register.html" class="login-register-link">Register</a>
          </p>
        </div>

        <!-- Compact Quick-Access Demonstration Accounts (No Passwords Exposed) -->
        <div class="login-demo-box">
          <div class="login-demo-header">
            <span class="login-demo-title">Quick-Access Accounts</span>
            <span class="login-demo-tag">Demo Only</span>
          </div>
          <div class="login-demo-grid">
            <button
              type="button"
              class="login-demo-btn"
              data-demo-role="Admin"
              data-demo-name="YuTara System Admin"
              data-demo-email="admin@yutara.ph"
              data-demo-tab="panel-accounts"
            >
              <span class="login-demo-left">
                <span class="login-demo-icon role-admin" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                  </svg>
                </span>
                <span>
                  <span class="login-demo-role">Admin</span>
                  <span class="login-demo-sub">Accounts &amp; property moderation</span>
                </span>
              </span>
              <span class="login-demo-arrow">Sign in &rarr;</span>
            </button>

            <button
              type="button"
              class="login-demo-btn"
              data-demo-role="User"
              data-demo-name="Juan Dela Cruz"
              data-demo-email="user@yutara.ph"
              data-demo-tab="panel-buyer"
            >
              <span class="login-demo-left">
                <span class="login-demo-icon role-user" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </span>
                <span>
                  <span class="login-demo-role">User Buyer / Seller</span>
                  <span class="login-demo-sub">Marketplace &amp; account listings</span>
                </span>
              </span>
              <span class="login-demo-arrow">Sign in &rarr;</span>
            </button>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="js/data.js?v=23"></script>
  <script src="js/app.js?v=23"></script>
</body>
</html>
